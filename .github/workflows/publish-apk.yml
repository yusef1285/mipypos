name: Publicar APK

# Publishes the APK produced by an "APK Android" run as a pre-release so it can
# be downloaded from the Releases page (also from a phone browser).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID de la ejecución de "APK Android"
        required: true
  # Manual runs need the file on the default branch; until then a push of this
  # file publishes the APK of RUN_ID below.
  push:
    branches: [modulos-empresariales]
    paths: [.github/workflows/publish-apk.yml]

env:
  RUN_ID: ${{ inputs.run_id || '42404930800' }}

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mipypos-apk
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Crear pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls dist/*.apk | head -1)
          SHA=$(gh api repos/${{ github.repository }}/actions/runs/${{ env.RUN_ID }} -q .head_sha)
          TAG="apk-${SHA::7}"
          gh release create "$TAG" "$APK" -R ${{ github.repository }} --target "$SHA" --prerelease \
            --title "MipyPOS – APK de prueba (${SHA::7})" \
            --notes "APK de prueba firmado con clave de desarrollo; no apto para Google Play. Haz una copia de tus datos antes de instalarlo sobre una versión existente."
